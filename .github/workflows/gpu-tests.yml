name: GPU tests
on:
  workflow_dispatch:
    inputs:
      suite:
        description: CUDA smoke checks or CPU/CUDA numerical parity
        type: choice
        options: [cuda, parity]
        default: cuda
  workflow_call:
    inputs:
      suite:
        type: string
        default: cuda
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
permissions:
  contents: read
concurrency:
  group: gpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  configure:
    if: >-
      github.event_name != 'pull_request' ||
      vars.GPU_TESTS_ON_PR == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'gpu-tests') ||
      contains(github.event.pull_request.labels.*.name, 'gpu-parity')
    runs-on: ubuntu-22.04
    outputs:
      suite: ${{ steps.config.outputs.suite }}
      runner: ${{ steps.config.outputs.runner }}
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: config
        env:
          RUNNER_LABEL: ${{ vars.GPU_RUNNER_LABEL }}
          REQUESTED_SUITE: ${{ inputs.suite }}
          DEFAULT_SUITE: ${{ vars.GPU_TEST_SUITE }}
          PARITY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'gpu-parity') }}
        run: |
          python - <<'PY'
          import os
          runner = os.environ['RUNNER_LABEL'].strip()
          suite = os.environ['REQUESTED_SUITE'] or ('parity' if os.environ['PARITY_LABEL'] == 'true' else os.environ['DEFAULT_SUITE'] or 'cuda')
          if not runner:
              raise SystemExit('Set repository variable GPU_RUNNER_LABEL to your hosted Linux T4 runner name.')
          if suite not in ('cuda', 'parity'):
              raise SystemExit('GPU_TEST_SUITE must be cuda or parity.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'runner={runner}\nsuite={suite}\n')
          PY
      - id: key
        run: echo "key=$(python cross-platform-install/gpu_ci.py cache-key)" >> "$GITHUB_OUTPUT"
  cpu-wheel:
    needs: configure
    if: needs.configure.outputs.suite == 'parity'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - uses: actions/cache/restore@v4
        id: wheel
        with:
          path: .gpu-ci/mlr55-wheel-cache
          key: ${{ needs.configure.outputs.key }}
      - run: python cross-platform-install/gpu_ci.py prepare-wheels
      - uses: actions/cache/save@v4
        if: steps.wheel.outputs.cache-hit != 'true'
        with:
          path: .gpu-ci/mlr55-wheel-cache
          key: ${{ needs.configure.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-triton-wheel
          path: .gpu-ci/mlr55-wheel-cache
          retention-days: 1
          if-no-files-found: error
  gpu:
    needs: [configure, cpu-wheel]
    if: >-
      always() && !cancelled() && needs.configure.result == 'success' &&
      (needs.configure.outputs.suite == 'cuda' || needs.cpu-wheel.result == 'success')
    runs-on: ${{ needs.configure.outputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - uses: actions/download-artifact@v4
        if: needs.configure.outputs.suite == 'parity'
        with:
          name: cpu-triton-wheel
          path: .gpu-ci/mlr55-wheel-cache
      - name: Install and test
        env:
          SUITE: ${{ needs.configure.outputs.suite }}
        shell: bash
        run: |
          mkdir -p .gpu-ci/results
          set -o pipefail
          python cross-platform-install/gpu_ci.py "$SUITE" 2>&1 | tee .gpu-ci/results/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-results
          path: .gpu-ci/results
          retention-days: 7
          if-no-files-found: warn
